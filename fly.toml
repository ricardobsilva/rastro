# Fly.io — uma única máquina com o SQLite num volume (o disco da máquina é apagado a cada deploy).
app = 'rastro'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DB_PATH = '/data/rastro.db'
  # O proxy do Fly acrescenta o IP do visitante no X-Forwarded-For.
  TRUST_PROXY_HOPS = '1'

[[mounts]]
  source = 'rastro_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
