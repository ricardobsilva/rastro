# fly.toml app configuration file generated for rastro on 2026-10-22T19:51:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rastro'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/rastro.db'
  NODE_ENV = 'production'
  PORT = '8080'
  TRUST_PROXY_HOPS = '1'

[[mounts]]
  source = 'rastro_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
